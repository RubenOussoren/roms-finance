name: CI

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Immutable publication SHA; empty preserves the default PR merge checkout
        required: false
        type: string
        default: ""

jobs:
  development_docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Verify shared development docs and adapters
        env:
          PUBLICATION_CHECKOUT_REF: ${{ inputs.checkout_ref }}
        run: |
          # Historical publication targets can predate this new tooling. This
          # exception never applies to PR CI (empty checkout_ref), nor to a
          # foundation-era checkout with partially deleted tooling.
          if [ -n "$PUBLICATION_CHECKOUT_REF" ] && [ ! -d .skills ] && [ ! -e bin/check-development-docs ]; then
            echo "::notice::Historical publication target predates foundation tooling; existing application/security gates remain required."
            exit 0
          fi
          ruby bin/check-development-docs
          bundle exec ruby test/tooling/check_development_docs_test.rb
          bundle exec ruby test/tooling/publish_workflow_test.rb
          test -f test/tooling/autonomy_check_test.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s test/tooling -p autonomy_check_test.py -v

  scan_ruby:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan Ruby application code
        run: bin/brakeman --no-pager

      - name: Audit locked Ruby dependencies against current advisories
        run: bundle exec bundler-audit check --update

  scan_js:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan importmap dependencies
        run: bin/importmap audit

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install locked npm dependencies
        run: npm ci

      - name: Audit npm dependencies
        run: npm audit

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  lint_js:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref }}

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        shell: bash

      - name: Lint/Format js code
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    # Covers service/dependency/browser setup plus both suites. The previous
    # 10-minute budget repeatedly cancelled otherwise passing test runs.
    timeout-minutes: 20

    env:
      PLAID_CLIENT_ID: foo
      PLAID_SECRET: bar
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/roms_test
      POSTGRES_DB: roms_test
      REDIS_URL: redis://localhost:6379/2
      RAILS_ENV: test
      PARALLEL_WORKERS: 2

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y curl libvips postgresql-client libpq-dev

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install locked Playwright toolchain and browsers
        run: |
          npm ci
          bundle exec ruby bin/verify-playwright
          npx --no-install playwright install --with-deps chromium

      - name: DB setup and smoke test
        run: |
          bin/rails db:create
          bin/rails db:schema:load
          bin/rails db:seed

      - name: Unit and integration tests
        env:
          COVERAGE: "true"
          COVERAGE_NAME: rails-unit-integration
        run: bin/rails test

      - name: Keep unit and integration coverage evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-integration-coverage
          path: coverage/
          include-hidden-files: true
          if-no-files-found: warn

      - name: System tests
        run: DISABLE_PARALLELIZATION=true bin/rails test:system

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore
